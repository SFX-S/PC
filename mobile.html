<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101a27">
<title>Cloud PC · تحكم الجوال</title>
<style>
:root{color-scheme:dark;--bg:#0d151f;--panel:#142233;--line:#2a3c50;--muted:#a6bbcc;--accent:#5ce1e6;--danger:#ff9ca8}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:#f7fbff;font:14px/1.5 system-ui,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit;border:1px solid var(--line);background:#1c3045;border-radius:12px;min-height:44px;touch-action:manipulation}button:disabled{opacity:.45;cursor:wait}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}button:active{background:#35536e}#app{display:flex;flex-direction:column;height:100dvh;height:var(--app-height,100dvh);padding-top:env(safe-area-inset-top);overflow:hidden}header{padding:9px 12px 8px;border-bottom:1px solid var(--line);background:var(--panel);flex:none}.topline{display:flex;align-items:center;gap:10px;margin-bottom:8px}.brand{font-weight:800;font-size:16px;white-space:nowrap;color:var(--accent)}#memory{font-size:11px;color:var(--muted);margin-inline-start:auto;max-width:55%;text-align:left}.topline button{min-height:44px;width:44px;border-radius:9px;font-size:20px}#navigate{display:flex;gap:6px}#address{background:#0b1724;border:1px solid #3a5269;border-radius:11px;min-width:0;width:100%;padding:9px 11px;color:#fff;font-size:16px;text-align:start;direction:ltr}#navigate button{padding:0 14px;background:var(--accent);color:#092025;border:0;font-weight:800}#warning{padding:7px 12px;background:#432e13;color:#ffe0a0;font-size:11px;flex:none}#viewport{position:relative;flex:1;min-height:80px;overflow:auto;overscroll-behavior:contain;direction:ltr;background:#080f18;scrollbar-width:thin;scrollbar-color:#466680 #101a27}#surface{position:relative;min-width:100%;min-height:100%}#desktop{border:0;position:absolute;left:0;top:0;transform-origin:top left;background:#080f18}#controls{flex:none;background:var(--panel);border-top:1px solid var(--line);padding:8px 10px max(9px,env(safe-area-inset-bottom))}.row{display:grid;gap:6px}.actions{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:6px}.view{grid-template-columns:repeat(5,minmax(0,1fr))}.dock{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:5px 2px;font-size:10px;line-height:1.3;min-height:48px;white-space:nowrap}.dock .icon{font:600 20px/1.2 system-ui}.primary{border-color:#4b969e;color:var(--accent);background:#143843}.danger{color:var(--danger)}#toast{position:fixed;bottom:150px;left:12px;right:12px;max-width:620px;margin:auto;background:#203b50;border:1px solid #517084;border-radius:12px;padding:11px 15px;z-index:20;font-size:13px;box-shadow:0 8px 30px #0006;pointer-events:none}dialog{background:#142638;color:#f5fbff;border:1px solid #41637b;border-radius:18px;padding:18px;width:min(94vw,520px);max-height:calc(var(--app-height,100dvh) - 32px);box-shadow:0 30px 80px #0009}dialog::backdrop{background:#0009}dialog h2{margin:0 0 8px;font-size:18px}dialog p{font-size:12px;color:#bbcedd;margin:0 0 12px}#typed-text{display:block;resize:vertical;width:100%;min-height:90px;max-height:28dvh;border:1px solid #45637a;background:#0d1a29;border-radius:10px;padding:12px;color:#fff;font-size:16px}.dialogrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.dialogrow button{padding:8px 13px}.send{background:var(--accent);color:#08232d;font-weight:800}#more-menu button{width:100%;margin-top:8px}#more-menu .small{font-size:12px;color:var(--muted)}[hidden]{display:none!important}@media(min-width:800px){#controls{display:flex;gap:10px;justify-content:center}.row{margin:0!important}.actions{width:440px}.view{width:460px}.dock{font-size:12px}header{padding-inline:18px}#navigate{max-width:1100px;margin:auto}.topline{max-width:1100px;margin-inline:auto}#toast{bottom:90px}}@media(max-height:460px) and (orientation:landscape){header{padding-block:4px}.topline{display:none}#controls{padding:4px 8px;display:flex;gap:7px}.actions{flex:1;margin:0}.view{flex:1}.dock{min-height:39px;font-size:9px}.dock .icon{font-size:16px}#warning{padding:3px 10px}}
</style>
<script src="/mobile-layout.js" defer></script>
<script src="/mobile.js" defer></script>
</head>
<body>
<main id="app">
<header>
  <div class="topline"><span class="brand" dir="ltr">Cloud PC</span><span id="memory" aria-live="polite">جارٍ فحص الموارد…</span><button id="more" aria-label="أدوات إضافية">⋯</button></div>
  <form id="navigate"><input id="address" aria-label="عنوان موقع أو بحث Google" placeholder="ابحث في Google أو اكتب عنوان موقع" autocomplete="off" enterkeyhint="go" maxlength="4096"><button type="submit">اذهب</button></form>
</header>
<aside id="warning" hidden></aside>
<section id="viewport" aria-label="شاشة الكمبيوتر السحابي"><div id="surface"><iframe id="desktop" src="about:blank" title="سطح المكتب" allow="fullscreen; clipboard-read; clipboard-write"></iframe></div></section>
<nav id="controls" aria-label="أدوات التحكم بالجوال">
  <div class="row actions">
    <button class="dock primary" data-command="open-browser"><span class="icon" aria-hidden="true">G</span>افتح Google</button>
    <button class="dock" data-command="maximize"><span class="icon" aria-hidden="true">□</span>تكبير النافذة</button>
    <button class="dock danger" data-command="close-tab"><span class="icon" aria-hidden="true">⊠</span>إغلاق التبويب</button>
    <button class="dock danger" data-command="close-window"><span class="icon" aria-hidden="true">×</span>إغلاق النافذة</button>
  </div>
  <div class="row view">
    <button class="dock" id="keyboard"><span class="icon" aria-hidden="true">⌨</span>اكتب نصًا</button>
    <button class="dock" id="zoom-in"><span class="icon" aria-hidden="true">＋</span>كبّر العرض</button>
    <button class="dock" id="fit"><span class="icon" aria-hidden="true">⤢</span><span id="zoom-label">ملاءمة</span></button>
    <button class="dock" id="zoom-out"><span class="icon" aria-hidden="true">−</span>صغّر العرض</button>
    <button class="dock" id="fullscreen"><span class="icon" aria-hidden="true">⛶</span>ملء الشاشة</button>
  </div>
</nav>
</main>
<div id="toast" role="status" hidden></div>
<dialog id="keyboard-dialog">
  <h2>اكتب من كيبورد الجوال</h2>
  <p>اضغط أولًا مكان الكتابة داخل الكمبيوتر، ثم اكتب النص هنا وأرسله. للبحث استخدم شريط العنوان أعلى الصفحة.</p>
  <textarea id="typed-text" dir="auto" aria-label="نص لإرساله إلى النافذة الحالية" placeholder="اكتب أو الصق النص هنا…" maxlength="8000"></textarea>
  <div class="dialogrow"><button id="send-text" class="send">أرسل النص</button><button data-key="enter">Enter ↵</button><button data-key="backspace">⌫ حذف</button><button id="keyboard-close">تم</button></div>
  <div class="dialogrow"><button data-key="tab">Tab</button><button data-key="escape">Esc</button><button data-key="up">↑</button><button data-key="down">↓</button><button data-key="left">←</button><button data-key="right">→</button></div>
</dialog>
<dialog id="more-menu">
  <h2>أدوات إضافية</h2>
  <button data-command="back">رجوع داخل المتصفح</button><button data-command="reload">تحديث صفحة المتصفح</button><button data-command="new-tab">تبويب جديد</button><button data-command="page-zoom-in">تكبير نص صفحة الموقع ＋</button><button data-command="page-zoom-out">تصغير نص صفحة الموقع −</button><button data-command="page-zoom-reset">حجم نص الصفحة الأصلي</button><button data-command="restore">تصغير النافذة من التكبير</button><button id="reconnect">إعادة اتصال الشاشة</button><button data-command="restart-browser" class="danger">إعادة تشغيل Brave</button>
  <p class="small">إعادة تشغيل Brave تغلق نوافذه الحالية. أدوات اللمس الأصلية متاحة داخل شاشة سطح المكتب.</p><button id="more-close">إغلاق القائمة</button>
</dialog>
</body>
</html>
